<body>

<div class="app-wrapper">

    <div class="app-header">
        <h1>Upcomer <span>·</span> desembolso</h1>
        <div class="app-badge">Contrato Banca Central</div>
    </div>

    <div class="grid-panel">

        <div class="form-panel">
            <h2>📋 Datos del contrato</h2>
            <form id="formDatos">
                <div class="form-grupo">
                    <label>👤 Nombre <i>*</i></label>
                    <input type="text" id="nombre" placeholder="Nombre del beneficiario" required />
                </div>
                <div class="form-grupo">
                    <label>📇 Apellido <i>*</i></label>
                    <input type="text" id="apellido" placeholder="Apellido" required />
                </div>
                <div class="form-grupo">
                    <label>🆔 Cédula / Pasaporte <i>*</i></label>
                    <input type="text" id="cedula" placeholder="Ej: 1234567890" required />
                </div>
                <div class="form-grupo">
                    <label>🏦 Banco para acreditación <i>*</i></label>
                    <select id="banco" required>
                        <option value="">Seleccione</option>
                        <option value="Banco Central">Banco Central</option>
                        <option value="Banco Pichincha">Banco Pichincha</option>
                        <option value="Banco Guayaquil">Banco Guayaquil</option>
                        <option value="Banco Pacífico">Banco Pacífico</option>
                        <option value="Banco Internacional">Banco Internacional</option>
                        <option value="Banco Bolivariano">Banco Bolivariano</option>
                        <option value="Banco Produbanco">Banco Produbanco</option>
                        <option value="Banco del Austro">Banco del Austro</option>
                        <option value="Banco Solidario">Banco Solidario</option>
                        <option value="Banco Solidario">Banco Jardin Azuayo</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-grupo">
                    <label>🔢 Número de cuenta <i>*</i></label>
                    <input type="text" id="numeroCuenta" placeholder="Ej: 1234567890" required />
                    <div class="hint">* Número de cuenta bancaria del beneficiario.</div>
                </div>
                <div class="form-grupo">
                    <label>⏳ Plazo de entrega <i>*</i></label>
                    <div class="plan-options" id="planContainer">
                        <label class="plan-option" data-plan="48h">
                            <input type="radio" name="plan" value="48h" data-costo="1010.18" checked />
                            <div class="plan-nombre">🚀 Express</div>
                            <div class="plan-precio">$1,010.18</div>
                            <div class="plan-dias">48h</div>
                        </label>
                        <label class="plan-option" data-plan="15d">
                            <input type="radio" name="plan" value="15d" data-costo="673.45" />
                            <div class="plan-nombre">📦 Estándar</div>
                            <div class="plan-precio">$673.45</div>
                            <div class="plan-dias">15 días</div>
                        </label>
                        <label class="plan-option" data-plan="30d">
                            <input type="radio" name="plan" value="30d" data-costo="394.28" />
                            <div class="plan-nombre">📬 Económico</div>
                            <div class="plan-precio">$394.28</div>
                            <div class="plan-dias">30 días</div>
                        </label>
                    </div>
                    <div class="hint">* El costo se reflejará en el contrato.</div>
                </div>
                <div class="form-grupo">
                    <label>✍️ Firma (nombre completo) <i>*</i></label>
                    <input type="text" id="firma" placeholder="Firma del beneficiario" required />
                </div>
                <div class="form-grupo">
                    <label>📅 Fecha <i>*</i></label>
                    <input type="date" id="fecha" required />
                </div>
                <div class="acciones">
                    <button type="button" class="btn btn-secundario" id="limpiarBtn">⟲ Limpiar</button>
                    <button type="submit" class="btn btn-primario">✍️ Firmar contrato</button>
                </div>
            </form>

                <h2>📄 Vista previa <span style="font-size:0.65rem; font-weight:400; color:#5a6f8a;">(actualiza en vivo)</span></h2>
                <button class="btn-pdf-header" id="descargarPdfDesdePreview">⬇️ Descargar PDF</button>
            </div>
            <div class="contrato-preview" id="contratoPreview"></div>
        </div>

    </div>

    <div class="nota-legal">
        ⚜️ Vista previa en vivo · Al generar el PDF se incluirá el contrato completo con los datos ingresados.
    </div>

</div>

<script>
    (function() {
        const nombreInput = document.getElementById('nombre');
        const apellidoInput = document.getElementById('apellido');
        const cedulaInput = document.getElementById('cedula');
        const bancoSelect = document.getElementById('banco');
        const numeroCuentaInput = document.getElementById('numeroCuenta');
        const firmaInput = document.getElementById('firma');
        const fechaInput = document.getElementById('fecha');
        const preview = document.getElementById('contratoPreview');
        const form = document.getElementById('formDatos');

        const MONEDERO_USDT = 'TCAgtcQNCecCRn5fV7ZrMa5euFzSyzPUu5';
        const RED_USDT = 'TRC-20 (Tron)';

        // Enlaces de pago por plan
        const LINKS_PAGO = {
            '48h': 'https://store.kunfupay.com/fondeo-upcomers-sa/HA0xGmDH',
            '15d': 'https://store.kunfupay.com/fondeo-upcomers-sa/TMBgQENO',
            '30d': 'https://store.kunfupay.com/fondeo-upcomers-sa/fnsN4duu'
        };

        const hoy = new Date().toISOString().split('T')[0];
        fechaInput.value = hoy;

        let planSeleccionado = '48h';
        let costoSeleccionado = 1010.18;
        const planNombres = { '48h': '48 horas (Express)', '15d': '15 días (Estándar)', '30d': '30 días (Económico)' };

        // Función para formatear moneda con dos decimales y coma de miles
        function formatMoney(value) {
            return value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        const planRadios = document.querySelectorAll('input[name="plan"]');
        planRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.checked) {
                    planSeleccionado = this.value;
                    costoSeleccionado = parseFloat(this.dataset.costo) || 0;
                    document.querySelectorAll('.plan-option').forEach(c => c.classList.remove('seleccionado'));
                    this.closest('.plan-option')?.classList.add('seleccionado');
                    renderContrato();
                }
            });
        });
        const primerRadio = document.querySelector('input[name="plan"]');
        if (primerRadio) {
            primerRadio.checked = true;
            primerRadio.closest('.plan-option')?.classList.add('seleccionado');
            planSeleccionado = primerRadio.value;
            costoSeleccionado = parseFloat(primerRadio.dataset.costo) || 0;
        }

        function generarHTMLContrato() {
            const nombre = nombreInput.value.trim() || '[Nombre]';
            const apellido = apellidoInput.value.trim() || '[Apellido]';
            const nombreCompleto = `${nombre} ${apellido}`.trim() || '[Beneficiario]';
            const cedula = cedulaInput.value.trim() || '[Cédula]';
            const banco = bancoSelect.value || '[Banco]';
            const numeroCuenta = numeroCuentaInput.value.trim() || '[Número de cuenta]';
            const firma = firmaInput.value.trim() || '[Firma]';
            const fechaRaw = fechaInput.value;
            const fecha = fechaRaw ? new Date(fechaRaw).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : '[Fecha]';
            const planTexto = planNombres[planSeleccionado] || planSeleccionado;
            const monto = costoSeleccionado;
            const linkPago = LINKS_PAGO[planSeleccionado] || LINKS_PAGO['48h'];

            // Cálculo del 10% de impuestos
            const impuesto = monto * 0.10;
            const totalConImpuesto = monto + impuesto;

            return `
                <div style="font-family: 'Inter', sans-serif; max-width: 100%;">

                    <!-- PÁGINA 1 -->
                    <div style="text-align: center; border-bottom: 2px solid #d0dcec; padding-bottom: 0.4rem; margin-bottom: 1rem;">
                        <strong style="font-size: 1.2rem; color: #0b1a33;">CONTRATO DE COMPROMISO</strong><br/>
                        <span style="font-size: 0.7rem; color: #3a4a62;">de desembolso y trámite ante la Banca Central</span><br/>
                        <span style="font-size: 0.65rem; color: #5a6f8a;">N° 2026-09-07</span>
                    </div>

                    <p style="margin-bottom: 1rem; font-size: 0.85rem;">
                        Por medio del presente documento, <strong>"Upcomer"</strong> (en adelante, <strong>LA ENTIDAD</strong>),
                        se compromete formalmente a gestionar y ejecutar el desembolso correspondiente a la solicitud de retiro
                        presentada por el cliente <strong>"${nombreCompleto}"</strong> (en adelante, <strong>EL BENEFICIARIO</strong>),
                        bajo los términos y condiciones que se detallan a continuación:
                    </p>

                    <div class="clausula">
                        <h3>PRIMERA. — Objeto del contrato</h3>
                        <p style="font-size: 0.85rem;">
                            LA ENTIDAD se obliga a realizar todas las gestiones necesarias ante la
                            <strong>Banca Central del país</strong>, así como ante las instancias financieras y regulatorias
                            correspondientes, a fin de obtener la autorización y liberación de los fondos solicitados por
                            EL BENEFICIARIO. Dichos trámites incluyen, pero no se limitan a:
                        </p>
                        <ul style="font-size: 0.85rem;">
                            <li>verificación de cuentas y validación de fondos,</li>
                            <li>cumplimiento de normativas cambiarias y de lavado de activos,</li>
                            <li>cualquier otro requisito exigido por la legislación vigente.</li>
                        </ul>
                    </div>

                    <div class="clausula">
                        <h3>SEGUNDA. — Plazo de desembolso</h3>
                        <p style="font-size: 0.85rem;">
                            EL BENEFICIARIO reconoce y acepta que el desembolso de su solicitud de retiro se efectuará en un
                            <strong>plazo determinado</strong>, el cual será notificado por LA ENTIDAD una vez que la Banca Central
                            haya emitido la resolución correspondiente. Dicho plazo será contado a partir de la fecha de recepción
                            de todos los documentos requeridos y la aprobación de las entidades competentes.
                            <br/><br/>
                            <span style="background: #f0f5fc; padding: 0.15rem 0.6rem; border-radius: 40px; font-size: 0.75rem;">
                                Plan seleccionado: <strong>${planTexto}</strong> · Costo: <strong>$${formatMoney(monto)}</strong>
                            </span>
                        </p>
                    </div>

                    <div style="margin-top: 1.5rem; padding-top: 0.6rem; border-top: 1px solid #e6edf6; text-align: center; font-size: 0.6rem; color: #8a9bb0; letter-spacing: 1px;">
                        Documento generado por Upcomer · Contrato de desembolso · Página 1 de 3
                    </div>

                    <!-- SALTO A PÁGINA 2 -->
                    <div class="page-break"></div>

                    <!-- PÁGINA 2 -->
                    <div class="clausula">
                        <h3>TERCERA. — Advertencia por incumplimiento</h3>
                        <div class="advertencia" style="font-size: 0.85rem;">
                            <p style="font-weight: 500; margin-bottom: 0.15rem;">▶ Penalización</p>
                            <p>
                                En caso de que LA ENTIDAD no realice el desembolso dentro del plazo estipulado, o si por causas
                                imputables a ella el trámite ante la Banca Central no se concluye satisfactoriamente,
                                <strong>LA ENTIDAD quedará automáticamente obligada a pagar a EL BENEFICIARIO</strong>
                                la suma de
                            </p>
                            <div style="display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap;">
                                <span class="monto" style="font-weight: 700; font-size: 1.3rem; color: #a0672b;">USD $50,000.00</span>
                                <span style="font-size: 0.8rem; color: #3d2e1e;">(cincuenta mil dólares americanos)</span>
                            </div>
                            <p style="margin-top: 0.4rem;">
                                en concepto de <strong>multa por daños y perjuicios</strong>, sin perjuicio de las acciones legales
                                adicionales que EL BENEFICIARIO pueda ejercer para hacer valer sus derechos.
                            </p>
                            <p style="margin-top: 0.4rem; font-size: 0.8rem;">
                                Dicha multa será exigible de pleno derecho, sin necesidad de interpelación judicial o extrajudicial
                                previa, y deberá ser cancelada dentro de los <strong>cinco (5) días hábiles</strong> siguientes al
                                vencimiento del plazo de desembolso.
                            </p>
                        </div>
                    </div>

                    <div class="clausula">
                        <h3>CUARTA. — Forma de pago</h3>
                        <p style="font-size: 0.85rem;">
                            El pago correspondiente deberá ser realizado por EL BENEFICIARIO a LA ENTIDAD a través del siguiente enlace de pago seguro:
                        </p>
                        <div class="monedero-box" style="background: #f0f7fe; border: 1px solid #c8dce8; border-radius: 12px; padding: 0.6rem 1rem; margin: 0.8rem 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
                            <span class="label" style="font-weight: 600; color: #0b1a33;">🔗 Enlace de pago:</span>
                            <a href="${linkPago}" target="_blank" rel="noopener noreferrer" class="direccion" style="font-family: monospace; font-size: 0.8rem; background: white; padding: 0.2rem 0.6rem; border-radius: 8px; border: 1px solid #d6dee9; word-break: break-all; color: #1e6f9f; text-decoration: underline;">${linkPago}</a>
                        </div>

                        <div class="advertencia-impuestos" style="background: #fff3e6; border-left: 6px solid #d97706; padding: 0.8rem 1rem; margin: 0.8rem 0; border-radius: 0 8px 8px 0;">
                            <p style="font-weight: 600; color: #b45309; margin-bottom: 0.3rem;">⚠️ ADVERTENCIA DE IMPUESTOS</p>
                            <p style="font-size: 0.85rem;">
                                Al monto del plan seleccionado se le aplicará un <strong>cargo adicional del 10%</strong> por concepto de
                                <strong>impuestos en el país</strong> (tasas regulatorias y contribuciones fiscales obligatorias).
                            </p>
                            <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem; font-size: 0.85rem;">
                                <span>Monto del plan: <strong>$${formatMoney(monto)}</strong></span>
                                <span>Impuesto (10%): <strong>$${formatMoney(impuesto)}</strong></span>
                                <span class="monto-total" style="font-weight: 700; font-size: 1.1rem; color: #b45309;">Total a pagar: $${formatMoney(totalConImpuesto)}</span>
                            </div>
                        </div>

                        <p style="font-size:0.75rem; color:#3a4a62; margin-top:0.2rem;">
                            El beneficiario deberá realizar el pago del monto total correspondiente al plan seleccionado más el
                            impuesto del 10% a través del enlace indicado, y enviar el comprobante de la transacción a LA ENTIDAD
                            para dar inicio al trámite ante la Banca Central.
                        </p>
                    </div>

                    <div style="margin-top: 1.5rem; padding-top: 0.6rem; border-top: 1px solid #e6edf6; text-align: center; font-size: 0.6rem; color: #8a9bb0; letter-spacing: 1px;">
                        Documento generado por Upcomer · Contrato de desembolso · Página 2 de 3
                    </div>

                    <!-- SALTO A PÁGINA 3 -->
                    <div class="page-break"></div>

                    <!-- PÁGINA 3 -->
                    <div class="clausula">
                        <h3>QUINTA. — Aceptación y firma</h3>
                        <p style="font-size: 0.85rem;">
                            Las partes declaran que han leído, comprendido y aceptado todas y cada una de las cláusulas contenidas
                            en el presente contrato, comprometiéndose a su fiel cumplimiento.
                        </p>
                        <p style="margin-top: 0.4rem; font-style: italic; color: #5d4e3e; font-size: 0.85rem;">
                            Firmado en <strong>Ciudad</strong>, a los <strong>${fecha}</strong>.
                        </p>
                    </div>

                    <div class="firma-line" style="display: flex; justify-content: space-between; margin-top: 1.2rem; border-top: 2px solid #e6edf6; padding-top: 1.2rem; flex-wrap: wrap; gap: 0.8rem;">
                        <div class="firma-bloco" style="flex: 1 1 150px;">
                            <p><strong>EL BENEFICIARIO</strong></p>
                            <p style="font-size: 0.85rem;">Nombre: ${nombreCompleto}</p>
                            <p style="font-size: 0.85rem;">Cédula / Pasaporte: ${cedula}</p>
                            <p style="font-size: 0.85rem;"><strong>Número de cuenta:</strong> ${numeroCuenta}</p>
                            <div class="linea" style="border-bottom: 1.5px solid #b3a18e; width: 100%; height: 1rem; margin: 0.2rem 0 0.05rem;"></div>
                            <span class="label" style="font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8a7a6a;">Firma</span>
                            <p style="font-weight: 400; font-size: 0.8rem; margin-top: 0.15rem;">${firma}</p>
                        </div>
                        <div class="firma-bloco" style="flex: 1 1 150px;">
                            <p><strong>LA ENTIDAD</strong></p>
                            <p style="font-size: 0.85rem;">Número de cuenta: __________________</p>
                            <div class="linea" style="border-bottom: 1.5px solid #b3a18e; width: 100%; height: 1rem; margin: 0.2rem 0 0.05rem;"></div>
                            <span class="label" style="font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8a7a6a;">Firma y sello</span>
                            <p style="font-weight: 400; font-size: 0.8rem; margin-top: 0.15rem;">Upcomer S.A.</p>
                        </div>
                    </div>

                    <div style="margin-top: 0.8rem; background: #f7faff; padding: 0.4rem 0.8rem; border-radius: 12px; font-size: 0.75rem; border: 1px solid #dee8f2;">
                        <strong>Banco de acreditación:</strong> ${banco} · <strong>Cuenta:</strong> ${numeroCuenta}
                    </div>

                    <div style="margin-top: 0.6rem; background: #f0f7fe; padding: 0.4rem 0.8rem; border-radius: 12px; font-size: 0.7rem; border: 1px solid #c8dce8;">
                        <strong>🔗 Enlace de pago:</strong> <a href="${linkPago}" target="_blank" style="color: #1e6f9f;">${linkPago}</a>
                    </div>

                    <div style="margin-top: 1.5rem; padding-top: 0.6rem; border-top: 1px solid #e6edf6; text-align: center; font-size: 0.6rem; color: #8a9bb0; letter-spacing: 1px;">
                        Documento generado por Upcomer · Contrato de desembolso · Página 3 de 3
                    </div>

                </div>
            `;
        }

        function renderContrato() {
            preview.innerHTML = generarHTMLContrato();
        }

        const inputs = [nombreInput, apellidoInput, cedulaInput, bancoSelect, numeroCuentaInput, firmaInput, fechaInput];
        inputs.forEach(input => {
            input.addEventListener('input', renderContrato);
            input.addEventListener('change', renderContrato);
        });

        renderContrato();

        document.getElementById('limpiarBtn').addEventListener('click', function() {
            nombreInput.value = '';
            apellidoInput.value = '';
            cedulaInput.value = '';
            bancoSelect.value = '';
            numeroCuentaInput.value = '';
            firmaInput.value = '';
            fechaInput.value = hoy;
            const radios = document.querySelectorAll('input[name="plan"]');
            radios.forEach(r => r.checked = false);
            document.querySelectorAll('.plan-option').forEach(c => c.classList.remove('seleccionado'));
            const primer = document.querySelector('input[name="plan"]');
            if (primer) {
                primer.checked = true;
                primer.closest('.plan-option')?.classList.add('seleccionado');
                planSeleccionado = primer.value;
                costoSeleccionado = parseFloat(primer.dataset.costo) || 0;
            }
            renderContrato();
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = nombreInput.value.trim();
            const apellido = apellidoInput.value.trim();
            const cedula = cedulaInput.value.trim();
            const banco = bancoSelect.value;
            const numeroCuenta = numeroCuentaInput.value.trim();
            const firma = firmaInput.value.trim();
            const fecha = fechaInput.value;

            if (!nombre || !apellido || !cedula || !banco || !numeroCuenta || !firma || !fecha) {
                alert('⚠️ Todos los campos son obligatorios.');
                return;
            }

            const linkPago = LINKS_PAGO[planSeleccionado] || LINKS_PAGO['48h'];
            const impuesto = costoSeleccionado * 0.10;
            const total = costoSeleccionado + impuesto;

            const mensaje = `✧ CONTRATO DE DESEMBOLSO · UPCOMER ✧\n\n` +
                `Beneficiario: ${nombre} ${apellido}\n` +
                `Cédula: ${cedula}\n` +
                `Banco: ${banco}\n` +
                `Número de cuenta: ${numeroCuenta}\n` +
                `Plan: ${planNombres[planSeleccionado]}\n` +
                `Costo base: $${formatMoney(costoSeleccionado)}\n` +
                `Impuesto (10%): $${formatMoney(impuesto)}\n` +
                `Total a pagar: $${formatMoney(total)}\n` +
                `Firma: ${firma}\n` +
                `Fecha: ${new Date(fecha).toLocaleDateString('es-ES')}\n` +
                `Enlace de pago: ${linkPago}\n\n` +
                `⚡ Pago obligatorio ante la Banca Central.\n` +
                `⚡ Incumplimiento: multa USD $50,000.\n\n` +
                `¿Confirmar la firma del contrato?`;

            if (confirm(mensaje)) {
                alert(`✅ Contrato firmado por ${nombre} ${apellido}.\nPlan: ${planNombres[planSeleccionado]}\nCosto base: $${formatMoney(costoSeleccionado)}\nImpuesto (10%): $${formatMoney(impuesto)}\nTotal a pagar: $${formatMoney(total)}\nBanco: ${banco}\nCuenta: ${numeroCuenta}\nEnlace de pago: ${linkPago}\n\nUpcomer gestionará el desembolso.`);
            }
        });

        function generarPDF() {
            if (!nombreInput.value.trim() || !apellidoInput.value.trim() || !cedulaInput.value.trim() || !bancoSelect.value || !numeroCuentaInput.value.trim() || !firmaInput.value.trim() || !fechaInput.value) {
                alert('⚠️ Completa todos los campos antes de generar el PDF.');
                return;
            }

            const btn = document.getElementById('descargarPdfDesdePreview');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader-pdf"></span> Generando...';
            btn.disabled = true;

            const contenidoHTML = generarHTMLContrato();

            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'padding: 0.4in; background: white; font-family: "Inter", sans-serif; max-width: 100%;';
            wrapper.innerHTML = contenidoHTML;

            const style = document.createElement('style');
            style.textContent = `
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: 'Inter', sans-serif; background: white; padding: 0; margin: 0; }
                .clausula { margin-bottom: 1rem; }
                .clausula h3 { font-size: 1rem; font-weight: 700; color: #0b1a33; border-left: 4px solid #1e6f9f; padding-left: 0.7rem; margin-bottom: 0.15rem; }
                .clausula ul { padding-left: 1.5rem; list-style: none; margin-top: 0.1rem; }
                .clausula ul li::before { content: "—"; color: #1e6f9f; margin-right: 0.4rem; }
                .advertencia { background: #f7f1ea; border-left: 6px solid #b8863a; padding: 0.6rem 1rem; margin: 0.6rem 0; border-radius: 0 8px 8px 0; }
                .monto { font-weight: 700; font-size: 1.3rem; color: #a0672b; }
                .advertencia-impuestos { background: #fff3e6; border-left: 6px solid #d97706; padding: 0.6rem 1rem; margin: 0.6rem 0; border-radius: 0 8px 8px 0; }
                .advertencia-impuestos .monto-total { font-weight: 700; font-size: 1.2rem; color: #b45309; }
                .firma-line { display: flex; justify-content: space-between; margin-top: 1.2rem; border-top: 2px solid #e6edf6; padding-top: 1.2rem; flex-wrap: wrap; gap: 0.8rem; }
                .firma-bloco { flex: 1 1 150px; }
                .firma-bloco .linea { border-bottom: 1.5px solid #b3a18e; width: 100%; height: 1rem; margin: 0.2rem 0 0.05rem; }
                .firma-bloco .label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8a7a6a; }
                .monedero-box { background: #f0f7fe; border: 1px solid #c8dce8; border-radius: 12px; padding: 0.6rem 1rem; margin: 0.6rem 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
                .monedero-box .label { font-weight: 600; color: #0b1a33; }
                .monedero-box .direccion { font-family: monospace; font-size: 0.8rem; background: white; padding: 0.2rem 0.6rem; border-radius: 8px; border: 1px solid #d6dee9; word-break: break-all; }
                p { font-size: 0.85rem; line-height: 1.5; margin-bottom: 0.3rem; }
                strong { color: #0b1a33; }
                a { color: #1e6f9f; text-decoration: underline; word-break: break-all; }
                .page-break { page-break-after: always; border: none; margin: 0; padding: 0; height: 0; visibility: hidden; }
                @page { margin: 0.4in; size: A4; }
                @media print { .page-break { page-break-after: always; } }
            `;
            wrapper.appendChild(style);

            const opt = {
                margin:        [0.4, 0.4, 0.4, 0.4],
                filename:     `Contrato_Upcomer_${nombreInput.value.trim()}_${apellidoInput.value.trim()}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, letterRendering: true, useCORS: true, logging: false, width: 800 },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(wrapper).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }).catch((err) => {
                console.error('Error PDF:', err);
                alert('Error al generar el PDF. Intenta de nuevo.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        document.getElementById('descargarPdfDesdePreview').addEventListener('click', generarPDF);

    })();
</script>

</body>
</html>
